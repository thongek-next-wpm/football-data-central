services:
  postgres:
    image: postgres:16-alpine
    container_name: fdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: football_data_central
    ports:
      - "5432:5432"
    volumes:
      - fdc_pg_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_data_central"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fdc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fdc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fdc_pg_data:
  fdc_redis_data:
